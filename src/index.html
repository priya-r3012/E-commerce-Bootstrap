<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script type="module" src="./assets/js/main.js"></script>
</head>

<body>

    <div class="top-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <div class="language">
                        <a href="#">English</a>
                        <a href="#">Dollar</a>
                    </div>
                </div>
                <div class="col-lg-6">
                    <ul class="top-menu">
                        <li><a href="#">Tracking Package</a></li>
                        <li><a href="#">FAQ</a></li>
                        <li><a href="#">About Us</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg">

        <div class="container">
            <a class="navbar-brand" href="#">ECOMMERCE</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbar">

                <form class="search-box mx-auto">

                    <input type="text" placeholder="Search here">

                    <button>
                        <i class="bi bi-search"></i>
                    </button>

                </form>

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="#">All Category<i class="bi bi-chevron-down"></i></a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Gift Cards</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Special Event</a>
                    </li>

                </ul>

                <div class="header-icons">

                    <a href="#"><i class="bi bi-heart"></i></a>

                    <a href="#"><i class="bi bi-person"></i></a>
                </div>
            </div>
        </div>
    </nav>


<section class="hero py-4">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-9">
                <div class="hero-banner position-relative overflow-hidden rounded-5">
                    <img src="./assets/images/image1.png" class="img-fluid w-100 h-100 hero-image" alt="image1">
                    <div class="hero-content">
                        <h1>Color of <br>Summer <br>Outfit</h1>
                        <p>
                            100+ Collections for your outfit
                            inspirations in this summer
                        </p>

                        <a href="#" class="btn hero-btn">VIEW COLLECTIONS</a>
                    </div>
                </div>
            </div>

            <div class="col-lg-3">
                <div class="row g-4">
                    <div class="col-lg-12 col-md-6">
                        <div class="small-card">
                            <img src="./assets/images/image2.png" class="img-fluid" alt="image2">

                            <div class="card-title">

                                <h2>Outdoor <br>Active </h2>

                            </div>
                        </div>
                    </div>

                    <div class="col-lg-12 col-md-6">

                        <div class="small-card">

                            <img src="./assets/images/image3.png" class="img-fluid" alt="image3">

                            <div class="card-title">

                                <h2>Casual <br> Comfort</h2>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>


</body>
</html>
